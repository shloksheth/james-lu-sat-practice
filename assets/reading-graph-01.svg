<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative fluid processed by two hypothetical processes</title>
  <desc id="desc">A line graph with time in days on the horizontal axis and cumulative processed volume in milliliters on the vertical axis. Process P has values 0, 10, 30, and 35 mL at days 0, 2, 4, and 6. Process Q has values 0, 15, 28, and 40 mL at the same days. Process P is a solid navy line with circular markers. Process Q is a dashed teal line with square markers.</desc>
  <rect width="900" height="650" rx="16" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#152d4b">
    <text x="450" y="42" text-anchor="middle" font-size="28" font-weight="700">Cumulative fluid processed</text>
    <g font-size="23">
      <line x1="254" y1="82" x2="299" y2="82" stroke="#203d68" stroke-width="4"/>
      <circle cx="277" cy="82" r="6" fill="#203d68"/>
      <text x="312" y="90">Process P</text>
      <line x1="503" y1="82" x2="548" y2="82" stroke="#087d85" stroke-width="4" stroke-dasharray="10 7"/>
      <rect x="520" y="76" width="12" height="12" fill="#087d85"/>
      <text x="561" y="90">Process Q</text>
    </g>
    <g stroke="#dde5ef" stroke-width="1.5">
      <line x1="130" y1="130" x2="790" y2="130"/>
      <line x1="130" y1="202" x2="790" y2="202"/>
      <line x1="130" y1="274" x2="790" y2="274"/>
      <line x1="130" y1="346" x2="790" y2="346"/>
      <line x1="130" y1="418" x2="790" y2="418"/>
      <line x1="130" y1="490" x2="790" y2="490"/>
    </g>
    <g stroke="#526477" stroke-width="2">
      <line x1="130" y1="125" x2="130" y2="490"/>
      <line x1="130" y1="490" x2="800" y2="490"/>
    </g>
    <g font-size="23" text-anchor="end">
      <text x="112" y="138">50</text><text x="112" y="210">40</text>
      <text x="112" y="282">30</text><text x="112" y="354">20</text>
      <text x="112" y="426">10</text><text x="112" y="498">0</text>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="130" y="526">0</text><text x="350" y="526">2</text>
      <text x="570" y="526">4</text><text x="790" y="526">6</text>
      <text x="460" y="572" font-size="25">Time (days)</text>
    </g>
    <text x="44" y="310" transform="rotate(-90 44 310)" text-anchor="middle" font-size="23">Cumulative processed volume (mL)</text>
    <polyline points="130,490 350,418 570,274 790,238" fill="none" stroke="#203d68" stroke-width="4"/>
    <polyline points="130,490 350,382 570,288.4 790,202" fill="none" stroke="#087d85" stroke-width="4" stroke-dasharray="10 7"/>
    <g fill="#203d68">
      <circle cx="130" cy="490" r="6"/><circle cx="350" cy="418" r="6"/>
      <circle cx="570" cy="274" r="6"/><circle cx="790" cy="238" r="6"/>
    </g>
    <g fill="#087d85">
      <rect x="124" y="484" width="12" height="12"/><rect x="344" y="376" width="12" height="12"/>
      <rect x="564" y="282.4" width="12" height="12"/><rect x="784" y="196" width="12" height="12"/>
    </g>
    <g font-size="23" font-weight="700" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke">
      <text x="350" y="449" fill="#203d68">10</text><text x="570" y="256" fill="#203d68">30</text>
      <text x="790" y="269" fill="#203d68">35</text>
      <text x="350" y="363" fill="#087d85">15</text><text x="570" y="319" fill="#087d85">28</text>
      <text x="790" y="182" fill="#087d85">40</text>
    </g>
    <text x="450" y="619" text-anchor="middle" font-size="19" fill="#536779">Markers show the recorded cumulative volumes at each time.</text>
  </g>
</svg>
